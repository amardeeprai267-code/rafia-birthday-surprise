<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rafia's Birthday Surprise 🌸</title>
<style>
body {
  margin:0; overflow:hidden;
  font-family:'Poppins',sans-serif;
  background: linear-gradient(270deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1,#fbc2eb);
  background-size:3000% 3000%;
  animation: gradientBG 60s ease infinite;
  transition: background 2s ease;
  color:white;
}
@keyframes gradientBG {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}
h1 {
  position:absolute; top:50px; width:100%;
  text-align:center; font-size:3em; font-weight:bold;
  text-shadow:0 0 15px #ff69b4,0 0 25px #ff1493; z-index:2;
}
#message {
  position:absolute; top:150px; width:100%;
  text-align:center; font-size:1.5em;
  text-shadow:0 0 10px #ff69b4,0 0 20px #ff1493; z-index:2;
}
button {
  position:absolute; bottom:30px; left:50%;
  transform:translateX(-50%); padding:12px 30px;
  font-size:1.3em; border:none; border-radius:30px;
  background:#ff6ec7; color:white; cursor:pointer;
  box-shadow:0 0 20px rgba(0,0,0,0.3); z-index:2; transition:0.3s;
}
button:hover {transform:scale(1.1); background:#ff2e90;}
canvas {position:absolute; top:0; left:0; width:100%; height:100%; z-index:1;}
</style>
</head>
<body>

<h1>🌸 Surprise for Rafia 🌸</h1>
<div id="message">
Rafia, Happy Birthday! I really like you until the end of everything 💖<br>
Birthday: 27/09/2006
</div>
<canvas id="canvas"></canvas>
<button onclick="toggleBackground()">🌙 Switch Background</button>

<audio id="bgMusic" loop autoplay>
  <source src="https://cdn.pixabay.com/download/audio/2023/03/16/audio_0549f426f7.mp3?filename=happy-birthday-suzume-style-114516.mp3" type="audio/mpeg">
</audio>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const bgMusic=document.getElementById('bgMusic');
let width=canvas.width=window.innerWidth;
let height=canvas.height=window.innerHeight;
let isNight=false;
let gradientOffset=0;

// ===== Day Sparkles & Petals =====
let sparkles=[], petals=[];
for(let i=0;i<150;i++) sparkles.push({x:Math.random()*width,y:Math.random()*height,size:Math.random()*3+1,dx:(Math.random()-0.5)*0.2,dy:(Math.random()-0.5)*0.2});
for(let i=0;i<50;i++) petals.push({x:Math.random()*width,y:Math.random()*height,size:Math.random()*8+4,dx:(Math.random()-0.5)*1,dy:Math.random()*1+0.5,color:`hsl(${Math.random()*360},80%,70%)`});

// ===== Fireworks =====
let fireworks=[], particles=[];
class Firework{
  constructor(x,y){this.x=x;this.y=y;this.targetY=Math.random()*height/2;this.color=`hsl(${Math.random()*360},100%,60%)`;this.speed=6;this.exploded=false;}
  update(){if(this.y>this.targetY&&!this.exploded)this.y-=this.speed;else if(!this.exploded){this.explode();this.exploded=true;}}
  draw(){if(!this.exploded){ctx.beginPath();ctx.fillStyle=this.color;ctx.arc(this.x,this.y,4,0,Math.PI*2);ctx.fill();}}
  explode(){for(let i=0;i<80;i++)particles.push(new Particle(this.x,this.y,this.color));}
}
class Particle{
  constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.speed=Math.random()*6+2;this.angle=Math.random()*Math.PI*2;this.alpha=1;}
  update(){this.x+=Math.cos(this.angle)*this.speed;this.y+=Math.sin(this.angle)*this.speed+0.3;this.alpha-=0.02;}
  draw(){ctx.globalAlpha=this.alpha;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
}

// ===== Animated Mathematical Flowers =====
class Flower{
  constructor(cx,cy,r,petals,color,angle=0,scale=1){this.cx=cx;this.cy=cy;this.r=r;this.petals=petals;this.color=color;this.angle=angle;this.scale=scale;this.growing=true;}
  update(){this.angle+=0.01;if(this.growing){this.scale+=0.002;if(this.scale>1.2)this.growing=false;}else{this.scale-=0.002;if(this.scale<0.8)this.growing=true;}}
  draw(){ctx.save();ctx.translate(this.cx,this.cy);ctx.rotate(this.angle);ctx.scale(this.scale,this.scale);ctx.strokeStyle=this.color;ctx.lineWidth=2;ctx.beginPath();
  for(let t=0;t<Math.PI*2;t+=0.01){let x=this.r*Math.sin(this.petals*t)*Math.cos(t);let y=this.r*Math.sin(this.petals*t)*Math.sin(t);ctx.lineTo(x,y);}
  ctx.stroke();ctx.restore();}
}

let flowers=[];
for(let i=0;i<5;i++) flowers.push(new Flower(Math.random()*width,Math.random()*height,30+Math.random()*50,3+Math.floor(Math.random()*5),`hsl(${Math.random()*360},80%,70%)`));

// ===== Draw forts =====
function drawForts(){
  const fortColors = [`rgba(50,50,80,0.5)`,`rgba(60,40,90,0.5)`];
  let fortWidth=width/10;
  for(let i=0;i<2;i++){
    ctx.fillStyle=fortColors[i];
    ctx.fillRect(i*fortWidth*4,height-150,fortWidth,150);
    ctx.fillRect(i*fortWidth*4+fortWidth/2,height-200,fortWidth/2,50);
  }
}

// ===== Draw Day =====
function drawDay(){
  // Background auto color change
  gradientOffset+=0.002;
  let gradient=ctx.createLinearGradient(0,0,width,height);
  gradient.addColorStop(0, `hsl(${gradientOffset*360%360},70%,80%)`);
  gradient.addColorStop(1, `hsl(${(gradientOffset*360+60)%360},70%,80%)`);
  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,width,height);

  // Forts
  drawForts();

  // Sparkles and petals
  sparkles.forEach(s=>{s.x+=s.dx;s.y+=s.dy;if(s.x<0)s.x=width;if(s.x>width)s.x=0;if(s.y<0)s.y=height;if(s.y>height)s.y=0;ctx.fillStyle='rgba(255,255,255,0.8)';ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill();});
  petals.forEach(p=>{p.x+=p.dx;p.y+=p.dy;if(p.y>height)p.y=-p.size;if(p.x>width)p.x=0;if(p.x<0)p.x=width;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();});
  flowers.forEach(f=>{f.update();f.draw();});
}

// ===== Animate =====
let fireworkInterval;
function animate(){
  ctx.clearRect(0,0,width,height);
  if(!isNight) drawDay();
  fireworks.forEach(fw=>{fw.update();fw.draw();});
  particles.forEach((p,i)=>{p.update();p.draw();if(p.alpha<=0)particles.splice(i,1);});
  requestAnimationFrame(animate);
}
animate();

// ===== Toggle Background =====
function toggleBackground(){
  isNight=!isNight;
  if(isNight){
    document.body.style.background="#000000";
    bgMusic.play();
    fireworkInterval=setInterval(()=>fireworks.push(new Firework(Math.random()*width,height)),500);
  } else {
    clearInterval(fireworkInterval);
    fireworks=[]; particles=[];
    bgMusic.pause();
  }
}

// ===== Resize =====
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;width=canvas.width;height=canvas.height;});
</script>
</body>
</html>
